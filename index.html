<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">

		<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
		<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
	</head>

	<body style="margin : 0px; overflow: hidden;">

		<div id="profile" style="color:green; width:300px; height:300px; background-color:red; position:absolute; top:0px; left:0;">Hello World!</div>
  
		<!-- a-frame scene -->
		<a-scene embedded arjs="debugUIEnabled: true;">
			<a-marker preset="hiro">
				<a-plane position="0.43 1.17 -1.48" rotation="-72 85 -88" scale="1 1 1" material="shader:html; target:#profile;"></a-plane>
			</a-marker>

			<a-entity camera></a-entity>
		</a-scene>
	</body>
</html>
